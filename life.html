  <title>实验室活动</title>

  <style>
    :root {
      --life-green: #287a60;
      --life-green-dark: #1d5d49;
      --life-green-pale: #eaf4f0;
      --life-ink: #1f2d29;
      --life-muted: #6d7d77;
      --life-line: rgba(40, 122, 96, 0.16);
      --life-paper: #ffffff;
      --life-page: #f6f9f7;
      --life-shadow: 0 18px 44px rgba(24, 68, 53, 0.16);
      --stack-photo-height: clamp(210px, 55vw, 390px);
    }

    .life-page .container,
    .life-page .container *,
    .life-page .lightbox,
    .life-page .lightbox * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body.life-page {
      width: 1200px;
      margin: 0 auto;
      color: var(--life-ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(89, 164, 132, 0.12), transparent 26rem),
        linear-gradient(180deg, #ffffff 0, var(--life-page) 32rem);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    body.lightbox-open {
      overflow: hidden;
    }

    .life-page .container {
      box-sizing: content-box;
      width: 1100px;
      margin: 0;
      padding: 132px 50px 84px;
    }

    .page-title {
      margin: 0;
      color: var(--life-green-dark);
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 750;
      letter-spacing: -0.04em;
      text-align: center;
    }

    .page-subtitle {
      margin: 12px 0 68px;
      color: var(--life-muted);
      font-size: 15px;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .activity {
      margin: 0 0 54px;
      padding: clamp(22px, 4vw, 38px);
      overflow: visible;
      border: 1px solid var(--life-line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 26px rgba(32, 83, 65, 0.06);
      transition: border-color 240ms ease, background 240ms ease;
    }

    .activity.is-open {
      border-color: rgba(40, 122, 96, 0.26);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 22px 54px rgba(32, 83, 65, 0.1);
    }

    .activity h3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0;
      padding: 0 0 0 15px;
      border-left: 5px solid var(--life-green);
      color: var(--life-ink);
      font-size: clamp(19px, 2.6vw, 24px);
      font-weight: 700;
      line-height: 1.35;
    }

    .album-toggle {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid rgba(40, 122, 96, 0.2);
      border-radius: 999px;
      color: var(--life-green-dark);
      background: var(--life-green-pale);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: color 220ms ease, background 220ms ease, border-color 220ms ease,
                  transform 220ms ease, box-shadow 220ms ease;
    }

    .album-toggle:hover {
      color: #ffffff;
      border-color: var(--life-green);
      background: var(--life-green);
      box-shadow: 0 8px 18px rgba(40, 122, 96, 0.22);
      transform: translateY(-1px);
    }

    .album-toggle:focus-visible,
    .gallery:focus-visible,
    .gallery.is-expanded img:focus-visible,
    .lightbox-close:focus-visible {
      outline: 3px solid rgba(40, 122, 96, 0.34);
      outline-offset: 4px;
    }

    .gallery {
      position: relative;
      isolation: isolate;
      margin-top: 27px;
    }

    .gallery img {
      display: block;
      margin: 0;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #dfece7, #f5faf8);
      object-fit: cover;
      object-position: center;
      transform-origin: top left;
      -webkit-user-drag: none;
      user-select: none;
    }

    .gallery.is-collapsed {
      width: min(680px, calc(100% - 54px));
      height: calc(var(--stack-photo-height) + 24px);
      margin-right: auto;
      margin-left: auto;
      cursor: pointer;
    }

    .gallery.is-collapsed img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--stack-photo-height);
      opacity: var(--stack-opacity, 0);
      box-shadow: var(--life-shadow);
      transform: translate3d(var(--stack-x, 54px), var(--stack-y, 0), 0)
                 scale(var(--stack-scale, 0.96));
      z-index: var(--stack-z, 1);
      pointer-events: none;
    }

    .gallery.is-collapsed img:first-of-type {
      pointer-events: auto;
    }

    .stack-label {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.44);
      border-radius: 999px;
      color: #ffffff;
      background: rgba(18, 45, 36, 0.68);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
      font-size: 13px;
      font-weight: 650;
      line-height: 1;
      letter-spacing: 0.02em;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .stack-label::after {
      content: "↗";
      font-size: 14px;
    }

    .gallery.is-collapsed:hover .stack-label {
      transform: translateY(-2px);
    }

    .gallery.is-expanded {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 20px;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .gallery.is-expanded img {
      position: relative;
      width: 100%;
      height: clamp(210px, 23vw, 275px);
      opacity: 1;
      box-shadow: 0 10px 26px rgba(27, 69, 54, 0.12);
      transform: none;
      cursor: zoom-in;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .gallery.is-expanded img:hover {
      z-index: 2;
      box-shadow: 0 18px 38px rgba(27, 69, 54, 0.2);
      transform: translateY(-5px) scale(1.012);
    }

    .gallery.is-expanded .stack-label {
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
    }

    .gallery.is-animating,
    .gallery.is-animating img {
      pointer-events: none;
    }

    .gallery.is-animating img {
      contain: paint;
      backface-visibility: hidden;
      will-change: transform, opacity;
      transition: none !important;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      visibility: hidden;
      opacity: 0;
      background: rgba(9, 18, 15, 0.9);
      backdrop-filter: blur(12px);
      pointer-events: none;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .lightbox.is-open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      display: block;
      max-width: min(94vw, 1380px);
      max-height: 88vh;
      border-radius: 16px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(12px) scale(0.965);
      transition: opacity 300ms ease, transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lightbox.is-open img {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 180ms ease, transform 180ms ease;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: rotate(5deg) scale(1.05);
    }

    @media (max-width: 760px) {
      body.life-page {
        width: 100%;
      }

      .life-page .container {
        box-sizing: border-box;
        width: 100%;
        padding: 112px 12px 64px;
      }

      .page-subtitle {
        margin-bottom: 44px;
      }

      .activity {
        margin-bottom: 24px;
        border-radius: 19px;
      }

      .activity h3 {
        align-items: flex-start;
        gap: 12px;
      }

      .album-toggle {
        min-height: 34px;
        padding: 7px 11px;
        font-size: 12px;
      }

      .gallery.is-expanded {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .gallery.is-expanded img {
        height: clamp(220px, 68vw, 330px);
      }

      .lightbox {
        padding: 16px;
      }

      .lightbox img {
        max-width: 96vw;
        max-height: 82vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var lightbox = document.getElementById("lightbox");
      var lightboxImg = document.getElementById("lightbox-img");
      var lightboxClose = lightbox.querySelector(".lightbox-close");
      var lastFocusedElement = null;
      var albumWarmups = new WeakMap();

      function openLightbox(image) {
        lastFocusedElement = document.activeElement;
        lightboxImg.src = image.currentSrc || image.src;
        lightboxImg.alt = image.alt || "实验室活动照片";
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.classList.add("lightbox-open");
        lightboxClose.focus({ preventScroll: true });
      }

      function closeLightbox() {
        if (!lightbox.classList.contains("is-open")) return;
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.classList.remove("lightbox-open");
        window.setTimeout(function () {
          lightboxImg.removeAttribute("src");
        }, reduceMotion ? 0 : 300);
        if (lastFocusedElement) lastFocusedElement.focus({ preventScroll: true });
      }

      function warmAlbum(gallery) {
        if (albumWarmups.has(gallery)) return albumWarmups.get(gallery);

        var images = Array.from(gallery.querySelectorAll("img"));

        /* 先发起低优先级加载，再逐张异步解码，避免点击时集中占用主线程。 */
        images.forEach(function (image, index) {
          image.loading = "eager";
          image.fetchPriority = index === 0 ? "high" : "low";
        });

        var warmup = images.reduce(function (chain, image) {
          return chain.then(function () {
            if (typeof image.decode !== "function") return undefined;
            return image.decode().catch(function () { return undefined; });
          });
        }, Promise.resolve());

        albumWarmups.set(gallery, warmup);
        return warmup;
      }

      function watchAlbumForWarmup(gallery) {
        var startWarmup = function () { warmAlbum(gallery); };

        gallery.addEventListener("pointerenter", startWarmup, { once: true, passive: true });
        gallery.addEventListener("touchstart", startWarmup, { once: true, passive: true });
        gallery.addEventListener("focusin", startWarmup, { once: true, passive: true });

        if ("IntersectionObserver" in window) {
          var observer = new IntersectionObserver(function (entries) {
            if (!entries.some(function (entry) { return entry.isIntersecting; })) return;
            observer.disconnect();
            if ("requestIdleCallback" in window) {
              window.requestIdleCallback(startWarmup, { timeout: 1200 });
            } else {
              window.setTimeout(startWarmup, 180);
            }
          }, { rootMargin: "500px 0px" });
          observer.observe(gallery);
        }
      }

      function updateAlbumState(gallery, expanded) {
        var activity = gallery.closest(".activity");
        var toggle = activity.querySelector(".album-toggle");
        var images = gallery.querySelectorAll("img");

        gallery.classList.toggle("is-expanded", expanded);
        gallery.classList.toggle("is-collapsed", !expanded);
        activity.classList.toggle("is-open", expanded);
        gallery.setAttribute("aria-expanded", String(expanded));
        gallery.setAttribute("aria-label", expanded ? "已展开的相册" : "点击展开相册");
        gallery.tabIndex = expanded ? -1 : 0;
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.textContent = expanded ? "收起相册 ↑" : images.length + " 张 · 展开 ↓";

        images.forEach(function (image) {
          image.tabIndex = expanded ? 0 : -1;
        });
      }

      function animateAlbum(gallery, expanded) {
        if (gallery.classList.contains("is-animating")) return;
        if (gallery.classList.contains("is-expanded") === expanded) return;

        if (expanded) warmAlbum(gallery);

        var images = Array.from(gallery.querySelectorAll("img"));
        var activity = gallery.closest(".activity");
        var activities = Array.from(document.querySelectorAll(".activity"));
        var activityIndex = activities.indexOf(activity);
        var followingActivities = activities.slice(activityIndex + 1);
        var firstRects = images.map(function (image) { return image.getBoundingClientRect(); });
        var firstOpacity = images.map(function (image) { return getComputedStyle(image).opacity; });
        var followingFirstRects = followingActivities.map(function (item) { return item.getBoundingClientRect(); });

        gallery.classList.add("is-animating");
        updateAlbumState(gallery, expanded);

        var lastRects = images.map(function (image) { return image.getBoundingClientRect(); });
        var finalStyles = images.map(function (image) {
          var style = getComputedStyle(image);
          return { transform: style.transform, opacity: style.opacity };
        });
        var followingLastRects = followingActivities.map(function (item) { return item.getBoundingClientRect(); });

        if (reduceMotion || typeof gallery.animate !== "function") {
          gallery.classList.remove("is-animating");
          return;
        }

        var duration = expanded ? 420 : 340;
        var easing = "cubic-bezier(0.22, 1, 0.36, 1)";
        var animations = images.map(function (image, index) {
          var first = firstRects[index];
          var last = lastRects[index];
          var dx = first.left - last.left;
          var dy = first.top - last.top;
          var sx = last.width ? first.width / last.width : 1;
          var sy = last.height ? first.height / last.height : 1;
          var finalTransform = finalStyles[index].transform === "none" ? "" : finalStyles[index].transform;
          var invertedTransform = "translate3d(" + dx + "px, " + dy + "px, 0) scale(" + sx + ", " + sy + ") " + finalTransform;

          return image.animate([
            { transform: invertedTransform, opacity: firstOpacity[index] },
            { transform: finalTransform || "none", opacity: finalStyles[index].opacity }
          ], {
            duration: duration,
            delay: expanded ? Math.min(index * 12, 96) : Math.min((images.length - index - 1) * 6, 54),
            easing: easing,
            fill: "both"
          });
        });

        /* 后续卡片只做合成层位移，避免相册高度变化造成视觉上的突然跳动。 */
        followingActivities.forEach(function (item, index) {
          var dy = followingFirstRects[index].top - followingLastRects[index].top;
          if (Math.abs(dy) < 1) return;
          item.style.willChange = "transform";
          animations.push(item.animate([
            { transform: "translate3d(0, " + dy + "px, 0)" },
            { transform: "translate3d(0, 0, 0)" }
          ], {
            duration: duration,
            easing: easing,
            fill: "both"
          }));
        });

        Promise.allSettled(animations.map(function (animation) { return animation.finished; }))
          .then(function () {
            animations.forEach(function (animation) { animation.cancel(); });
            followingActivities.forEach(function (item) { item.style.removeProperty("will-change"); });
            gallery.classList.remove("is-animating");
          });
      }

      document.querySelectorAll(".gallery").forEach(function (gallery, galleryIndex) {
        var activity = gallery.closest(".activity");
        var heading = activity.querySelector("h3");
        var images = Array.from(gallery.querySelectorAll("img"));
        var galleryId = "activity-gallery-" + (galleryIndex + 1);
        var toggle = document.createElement("button");
        var label = document.createElement("span");

        gallery.id = galleryId;
        gallery.setAttribute("role", "group");

        images.forEach(function (image, index) {
          var layer = Math.min(index, 3);
          image.style.setProperty("--stack-x", (layer * 18) + "px");
          image.style.setProperty("--stack-y", (24 - layer * 8) + "px");
          image.style.setProperty("--stack-scale", String(1 - layer * 0.012));
          image.style.setProperty("--stack-z", String(40 - layer));
          image.style.setProperty("--stack-opacity", index < 4 ? "1" : "0");
          image.loading = index < 4 ? "eager" : "lazy";
          image.fetchPriority = index === 0 ? "high" : "low";
          image.decoding = "async";
        });

        toggle.className = "album-toggle";
        toggle.type = "button";
        toggle.setAttribute("aria-controls", galleryId);
        toggle.addEventListener("click", function () {
          animateAlbum(gallery, !gallery.classList.contains("is-expanded"));
        });
        heading.appendChild(toggle);

        label.className = "stack-label";
        label.textContent = "查看全部 " + images.length + " 张";
        gallery.appendChild(label);

        updateAlbumState(gallery, false);
        watchAlbumForWarmup(gallery);

        gallery.addEventListener("click", function (event) {
          var image = event.target.closest("img");
          if (!image) return;
          if (gallery.classList.contains("is-collapsed")) {
            animateAlbum(gallery, true);
          } else {
            openLightbox(image);
          }
        });

        gallery.addEventListener("keydown", function (event) {
          var image = event.target.closest("img");
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          if (gallery.classList.contains("is-collapsed")) {
            animateAlbum(gallery, true);
          } else if (image) {
            openLightbox(image);
          }
        });
      });

      lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox) closeLightbox();
      });
      lightboxImg.addEventListener("click", function (event) { event.stopPropagation(); });
      lightboxClose.addEventListener("click", closeLightbox);

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeLightbox();
      });
    }());
  </script>
</body>
</html>
